name: Run AI QA Pipeline

# Manual trigger only — this calls the OpenAI API and costs money.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to run"
        type: choice
        options: ["all", "1"]
        default: "all"
      filter:
        description: "Test case filter (only used when phase = all)"
        type: choice
        options: [all, smoke, high]
        default: all
      publish:
        description: "Commit the report to reports/latest so it shows in the repo"
        type: boolean
        default: true

permissions:
  contents: write # needed to commit the report back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          node index.js --phase=${{ inputs.phase }} --source=bundle --filter=${{ inputs.filter }}

      - name: Build report
        if: always()
        run: |
          node scripts/buildReport.js reports/latest
          cat reports/latest/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-run-${{ github.run_number }}
          path: |
            runs/
            reports/latest/
          if-no-files-found: ignore

      - name: Commit report to repo
        if: success() && inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore(report): update AI QA results (run #${{ github.run_number }})"
            git push
          fi
