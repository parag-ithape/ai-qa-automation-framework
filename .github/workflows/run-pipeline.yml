name: Run AI QA Pipeline

# Manual trigger only — this calls the OpenAI API and costs money.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to run"
        type: choice
        options: ["1", "all"]
        default: "1"
      filter:
        description: "Test case filter (only used when phase = all)"
        type: choice
        options: [all, smoke, high]
        default: all

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          node index.js --phase=${{ inputs.phase }} --source=bundle --filter=${{ inputs.filter }}

      - name: Publish results to run summary
        if: always()
        run: |
          {
            echo "# AI QA Pipeline Results"
            echo ""
            summary=$(ls -t runs/*/phase1-requirement-analysis/analysis-summary.md 2>/dev/null | head -1)
            if [ -n "$summary" ]; then
              echo "## Phase 1 — Requirement Analysis"
              cat "$summary"
              echo ""
            else
              echo "_No Phase 1 summary was produced — check the 'Run pipeline' step logs._"
            fi
            if [ -f testCases.json ]; then
              echo "## Generated Test Cases"
              node -e '
                const r = JSON.parse(require("fs").readFileSync("testCases.json","utf8"));
                const s = r.summary || {};
                console.log(`**Total:** ${s.total ?? r.testCases.length} | **Smoke:** ${s.smoke ?? "-"} | **Regression:** ${s.regression ?? "-"} | **High priority:** ${s.highPriority ?? "-"}\n`);
                console.log("| ID | Module | Title | Priority | Tags |");
                console.log("|----|--------|-------|----------|------|");
                for (const tc of r.testCases || []) {
                  const esc = (v) => String(v ?? "").replace(/\|/g, "\\|").replace(/\n/g, " ");
                  console.log(`| ${esc(tc.testId)} | ${esc(tc.module)} | ${esc(tc.title)} | ${esc(tc.priority)} | ${esc((tc.tags || []).join(", "))} |`);
                }
              '
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-run-${{ github.run_number }}
          path: |
            runs/
            moduleData.json
            testCases.json
          if-no-files-found: ignore
